            justify-content: space-around;

           }
              section>div>div:nth-child(2)>p{

        @media screen and (0px<=width<=468px){
            section>div:nth-child(1){

                flex-direction: column;
        }
          section>div>div:nth-child(2)>p{
                
                width: 90%;
                color: brown;
                text-align: justify;
               
              }
        }
